services:
  origyn:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist downloaded models across container restarts
      - origyn-models:/app/models
      - origyn-data:/app/data
    environment:
      - HF_HOME=/app/models
      - ORIGYN_PROFILE=standard
      - ORIGYN_CORS_ORIGINS=*
    restart: unless-stopped

  # Uncomment for NVIDIA GPU support:
  # origyn-gpu:
  #   build: .
  #   ports:
  #     - "8000:8000"
